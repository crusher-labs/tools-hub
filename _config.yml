# GitHub Pages builds this repo with Jekyll. Without this list it publishes every
# Markdown file as an indexable page and serves the build scripts raw. Only the
# hub and the tool pages are the site.
#
# The tool pages have no front matter, so Jekyll copies them byte for byte.
# Patterns are matched with File.fnmatch, where * also crosses "/".
exclude:
  - "*.md"
  - "scripts"
  - "*/scripts"
  - "package.json"
  - "package-lock.json"
  - "node_modules"
