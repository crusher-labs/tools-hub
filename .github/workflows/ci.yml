name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tools are subdirectories of this repo since the 2026-09 consolidation,
      # so checkout alone gives the runner everything. (Before that they were 37
      # separate repos cloned in here; the checker fails hard unless every catalog
      # entry is audited, which is what caught the silently-skipped directory.)
      - name: Validate static contract (hub + tools)
        run: npm run check:static

      # The catalog and sitemap are generated files. If someone edits tools.json
      # without re-running the generators, the hub loses a crawlable link or the
      # sitemap omits a page - the exact failure that left all 37 tools unindexed.
      - name: Generated files are up to date
        run: |
          node scripts/render-catalog.mjs
          node scripts/render-sitemap.mjs
          git diff --exit-code -- index.html sitemap.xml \
            || { echo "::error::index.html or sitemap.xml is stale - run scripts/render-catalog.mjs and scripts/render-sitemap.mjs"; exit 1; }
