name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # render-sitemap dates each page by its last commit, so it needs history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The tools are subdirectories of this repo since the 2026-09 consolidation,
      # so checkout alone gives the runner everything. (Before that they were 37
      # separate repos cloned in here; the checker fails hard unless every catalog
      # entry is audited, which is what caught the silently-skipped directory.)
      - name: Validate static contract (hub + tools)
        run: npm run check:static

      # The catalog and sitemap are generated files. If someone edits tools.json
      # without re-running the generators, the hub loses a crawlable link or the
      # sitemap omits a page - the exact failure that left all 37 tools unindexed.
      # Every generated block (catalog, JSON-LD, author link, related-tools row,
      # share-card tags, sitemap) must match what the scripts produce from the repo.
      - name: Generated files are up to date
        run: |
          node scripts/render-catalog.mjs
          node scripts/apply-jsonld.mjs
          node scripts/apply-author-link.mjs
          node scripts/apply-related-links.mjs
          node scripts/apply-og.mjs
          node scripts/render-sitemap.mjs
          git diff --exit-code -- '*.html' sitemap.xml \
            || { echo "::error::generated files are stale - run npm run build and commit (a page committed on a later day than its render also lands here; re-render and commit)"; exit 1; }
