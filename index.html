    <style>
        body { font-family: 'Inter', sans-serif; }
        .crusher-tool-shell { padding-block-start: 5rem; }

        .hub-trust-signal {
            display: flex; flex-wrap: wrap; justify-content: center;
            gap: var(--crusher-spacing-2) var(--crusher-spacing-4);
            margin-block-start: var(--crusher-spacing-3);
            font-size: var(--crusher-font-size-xs);
            color: var(--crusher-text-secondary);
            text-transform: uppercase; letter-spacing: 0.08em;
        }
        .hub-trust-signal span { display: inline-flex; align-items: center; gap: var(--crusher-spacing-1); }
        .hub-trust-signal svg { color: var(--crusher-color-brand-primary); }

        .hub-search { display: grid; gap: var(--crusher-spacing-2); max-width: 36rem; margin: var(--crusher-spacing-6) auto 0; }
        .hub-search input.crusher-tool-control { padding: var(--crusher-spacing-3); }
        .hub-empty {
            padding: var(--crusher-spacing-10) var(--crusher-spacing-6);
            text-align: center; color: var(--crusher-text-secondary);
            display: grid; justify-items: center; gap: var(--crusher-spacing-3);
        }
        .hub-empty[hidden] { display: none; }
        .hub-empty-icon {
            inline-size: 3rem; block-size: 3rem;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--crusher-radius-full);
            background: var(--crusher-background-muted);
            color: var(--crusher-text-secondary);
        }
        .hub-empty p { margin: 0; }
        .hub-empty-clear {
            margin-top: var(--crusher-spacing-2);
            padding: var(--crusher-spacing-2) var(--crusher-spacing-4);
            border-radius: var(--crusher-radius-full);
            background: transparent;
            border: 1px solid var(--crusher-border-primary);
            color: var(--crusher-color-brand-primary);
            font-weight: 600; font-size: var(--crusher-font-size-sm);
            cursor: pointer;
            transition: border-color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard);
        }
        .hub-empty-clear:hover { border-color: var(--crusher-color-brand-primary); }
        .hub-sections { display: grid; gap: var(--crusher-spacing-10); }
        .hub-section { display: grid; gap: var(--crusher-spacing-5); }
        .hub-section-header {
            display: flex; align-items: baseline; gap: var(--crusher-spacing-3);
            padding-block-end: var(--crusher-spacing-3);
            border-block-end: 1px solid var(--crusher-border-primary);
        }
        .hub-section-title {
            margin: 0;
            font-size: var(--crusher-font-size-xs);
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--crusher-color-brand-primary);
        }
        .hub-section-count {
            font-size: var(--crusher-font-size-xs);
            color: var(--crusher-text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .hub-section[data-category="design"] { --crusher-color-brand-primary: #8b5cf6; }
        .hub-section[data-category="media"]  { --crusher-color-brand-primary: #10b981; }
        .hub-section[data-category="security"] { --crusher-color-brand-primary: #f43f5e; }
        .hub-section[data-category="time"]   { --crusher-color-brand-primary: #f59e0b; }

        .hub-grid { display: grid; gap: var(--crusher-spacing-6); grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
        .hub-card {
            display: grid; align-content: start;
            gap: var(--crusher-spacing-3);
            padding: var(--crusher-spacing-6);
            border: 1px solid transparent;
            transition: transform var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard),
                        border-color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard),
                        box-shadow var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard);
        }
        .hub-card:hover {
            transform: translateY(-2px);
            border-color: var(--crusher-color-brand-primary);
            box-shadow: var(--crusher-shadow-lg);
        }
        @media (prefers-reduced-motion: reduce) {
            .hub-card { transition: border-color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard); }
            .hub-card:hover { transform: none; box-shadow: none; }
        }
        .hub-card-icon {
            inline-size: 2.75rem; block-size: 2.75rem;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: var(--crusher-radius-lg);
            background: color-mix(in srgb, var(--crusher-color-brand-primary) 12%, var(--crusher-background-muted));
            color: var(--crusher-color-brand-primary);
        }
        .hub-card-title { margin: 0; font-size: var(--crusher-font-size-lg); color: var(--crusher-text-primary); }
        .hub-card-desc { margin: 0; color: var(--crusher-text-secondary); font-size: var(--crusher-font-size-sm); }
        .hub-card-cta {
            margin-top: var(--crusher-spacing-2);
            display: inline-flex; align-items: center; gap: var(--crusher-spacing-1);
            font-size: var(--crusher-font-size-xs); font-weight: 600;
            color: var(--crusher-color-brand-primary);
        }

        .hub-home {
            position: absolute; inset-block-start: var(--crusher-spacing-6); inset-inline-start: var(--crusher-spacing-6);
            inline-size: 2.75rem; block-size: 2.75rem;
            display: inline-flex; align-items: center; justify-content: center;
            border: 1px solid var(--crusher-border-primary); border-radius: var(--crusher-radius-full);
            background: var(--crusher-background-surface); color: var(--crusher-text-secondary);
            transition: color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard),
                        border-color var(--crusher-motion-duration-fast) var(--crusher-motion-easing-standard);
        }
        .hub-home:hover { color: var(--crusher-color-brand-primary); border-color: var(--crusher-color-brand-primary); }

        .hub-footer p { margin: 0; }

        .hub-footer a { color: var(--crusher-color-brand-primary); text-decoration: none; }
        .hub-footer a:hover { text-decoration: underline; }

    <script type="module" src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.standalone.esm.js" integrity="sha384-RkuNGzCebUwZ5RZDFSKGQ7sDaUpdPfDxO088yXDMPM5CvJ4eBy2Jf/UhLwGay/4K" crossorigin="anonymous"></script>

    <script>
        const sectionsRoot = document.getElementById('hub-sections');
        const searchBar = document.getElementById('search-bar');
        const noResults = document.getElementById('hub-no-results');
        const toolCards = [];
        const sectionRefs = [];

        const CATEGORIES = [
            { id: 'text', label: 'Text & Data' },
            { id: 'design', label: 'Color & Design' },
            { id: 'media', label: 'Image & Media' },
            { id: 'security', label: 'Security & Privacy' },
            { id: 'time', label: 'Time & Date' }
        ];

        function cloneIcon(name) {
            const tpl = document.getElementById('icon-' + name) || document.getElementById('icon-qr');
            return tpl.content.cloneNode(true);
        }

        function buildCard(tool) {
            const card = document.createElement('a');
            card.href = tool.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            card.className = 'crusher-tool-card hub-card';

            const iconWrap = document.createElement('span');
            iconWrap.className = 'hub-card-icon';
            iconWrap.appendChild(cloneIcon(tool.icon));
            card.appendChild(iconWrap);

            const title = document.createElement('h3');
            title.className = 'hub-card-title';
            title.textContent = tool.name;
            card.appendChild(title);

            const desc = document.createElement('p');
            desc.className = 'hub-card-desc';
            desc.textContent = tool.description;
            card.appendChild(desc);

            const cta = document.createElement('span');
            cta.className = 'hub-card-cta';
            const ctaLabel = document.createElement('span');
            ctaLabel.textContent = 'Launch Tool';
            cta.appendChild(ctaLabel);
            cta.appendChild(cloneIcon('cta'));
            card.appendChild(cta);

            return card;
        }

        function renderTools(tools) {
            sectionsRoot.replaceChildren();
            toolCards.length = 0;
            sectionRefs.length = 0;

            for (const meta of CATEGORIES) {
                const inCat = tools.filter(t => t.category === meta.id);
                if (inCat.length === 0) continue;

                const section = document.createElement('section');
                section.className = 'hub-section';
                section.dataset.category = meta.id;

                const header = document.createElement('div');
                header.className = 'hub-section-header';
                const h2 = document.createElement('h2');
                h2.className = 'hub-section-title';
                h2.textContent = meta.label;
                const count = document.createElement('span');
                count.className = 'hub-section-count';
                count.textContent = `${inCat.length} tool${inCat.length === 1 ? '' : 's'}`;
                header.appendChild(h2);
                header.appendChild(count);
                section.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'hub-grid';
                section.appendChild(grid);

                const cardsInSection = [];
                for (const tool of inCat) {
                    const card = buildCard(tool);
                    grid.appendChild(card);
                    const entry = {
                        element: card,
                        name: String(tool.name || '').toLowerCase(),
                        description: String(tool.description || '').toLowerCase(),
                        category: meta.id
                    };
                    toolCards.push(entry);
                    cardsInSection.push(entry);
                }

                sectionsRoot.appendChild(section);
                sectionRefs.push({ section, count: cardsInSection, countEl: count });
            }
        }

        function renderError(message) {
            grid.replaceChildren();
            const empty = document.createElement('section');
            empty.className = 'crusher-tool-surface hub-empty';
            const heading = document.createElement('h2');
            heading.textContent = 'Tools unavailable';
            const p = document.createElement('p');
            p.textContent = message;
            empty.appendChild(heading);
            empty.appendChild(p);
            grid.appendChild(empty);
        }

        async function loadTools() {
            try {
                const response = await fetch('./tools.json', { cache: 'no-store' });
                if (!response.ok) throw new Error('Unable to load tools.json (' + response.status + ')');
                renderTools(await response.json());
            } catch (error) {
                renderError(error.message);
            }
        }

        searchBar.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            let visibleCount = 0;
            for (const card of toolCards) {
                const visible = card.name.includes(term) || card.description.includes(term) || card.category.includes(term);
                card.element.style.display = visible ? '' : 'none';
                if (visible) visibleCount++;
            }
            for (const { section, count } of sectionRefs) {
                const sectionVisible = count.some(c => c.element.style.display !== 'none');
                section.hidden = !sectionVisible;
            }
            noResults.hidden = visibleCount > 0 || toolCards.length === 0;
        });

        document.getElementById('hub-clear-search').addEventListener('click', () => {
            searchBar.value = '';
            searchBar.dispatchEvent(new Event('input', { bubbles: true }));
            searchBar.focus();
        });

        document.addEventListener('keydown', (e) => {
            const ae = document.activeElement;
            const inField = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable);
            if (e.key === '/' && !inField && !e.ctrlKey && !e.metaKey && !e.altKey) {
                e.preventDefault();
                searchBar.focus();
                searchBar.select();
            }
            if (e.key === 'Escape' && ae === searchBar) {
                if (searchBar.value !== '') {
                    searchBar.value = '';
                    searchBar.dispatchEvent(new Event('input', { bubbles: true }));
                } else {
                    searchBar.blur();
                }
            }
        });

        loadTools();
    </script>
</body>
</html>
